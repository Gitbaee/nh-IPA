name: Analyze Collected KRX Shorting Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository data
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependency
        run: python -m pip install pandas

      - name: Analyze already-collected files (no KRX requests)
        run: python analyze_shorting_data.py

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: collected-krx-shorting-analysis
          path: |
            output/shorting_analysis_summary.txt
            output/shorting_analysis_top_symbols.csv
          if-no-files-found: warn
