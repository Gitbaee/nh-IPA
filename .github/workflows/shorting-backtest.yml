name: KRX Short-Selling Backtest Data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "backfill = 2026-05-01부터 전체 수집 / incremental = 최근 10일 갱신"
        required: true
        type: choice
        options:
          - backfill
          - incremental
        default: backfill
      start_date:
        description: "시작일 YYYYMMDD (기본 20260501)"
        required: false
        default: "20260501"
      end_date:
        description: "종료일 YYYYMMDD (비우면 오늘)"
        required: false
        default: ""
  schedule:
    # 평일 08:30 KST — 전일 공매도 거래 데이터 수집 및 T+2 잔고 재확인
    - cron: "30 23 * * 0-4"

permissions:
  contents: write

concurrency:
  group: krx-shorting-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      KRX_LENDING_API_KEY: ${{ secrets.KRX_LENDING_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
      SHORTING_MODE: ${{ github.event_name == 'schedule' && 'incremental' || inputs.mode || 'backfill' }}
      SHORTING_START_DATE: ${{ inputs.start_date || '20260501' }}
      SHORTING_END_DATE: ${{ inputs.end_date }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install git+https://github.com/beaten-by-the-market/krx-data-api.git

      - name: Validate configured lending API secret (presence only)
        shell: bash
        run: |
          if [[ -n "${KRX_LENDING_API_KEY:-}" ]]; then
            echo "KRX_LENDING_API_KEY is configured."
          else
            echo "::warning::KRX_LENDING_API_KEY is not configured; lending collection will remain unavailable."
          fi

      - name: Validate Python
        run: python -m py_compile shorting_backtest_data.py Alerts.py

      - name: Collect KRX short-selling, balance and price history
        run: python shorting_backtest_data.py

      - name: Persist compressed historical datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shorting/*.csv.gz output/shorting_collection_status.csv output/shorting_collection_failures.csv output/shorting_collection_summary.txt
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "Update KRX short-selling backtest data"
            git push
          fi

      - name: Upload collection report and datasets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-shorting-backtest-data
          path: |
            output/shorting_collection_summary.txt
            output/shorting_collection_status.csv
            output/shorting_collection_failures.csv
            data/shorting/*.csv.gz
          if-no-files-found: warn
