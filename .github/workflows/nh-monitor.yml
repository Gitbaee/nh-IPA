name: Stock Bollinger Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 0-4"
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: List files
        run: ls -R
      - name: Install
        run: pip install yfinance pandas requests lxml python-dotenv keyring keyrings.alt websockets openpyxl
      - name: Run
        run: |
          if [ -f main.py ]; then python main.py --bollinger; 
          elif [ -f alert_config/main.py ]; then python alert_config/main.py --bollinger;
          else echo "main.py 없음"; exit 1; fi
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: output/summary.txt
