name: Stock Bollinger Monitor
on:
  schedule:
    - cron: "0 23 * * 0-4"
    - cron: "0 0 * * 1-5"
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install yfinance pandas requests lxml
      - name: Run
        run: python main.py --bollinger
