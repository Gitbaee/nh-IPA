name: NH PLUG Morning Monitor

on:
  schedule:
    - cron: "0 23 * * 0-4"
    - cron: "0 0 * * 1-5"
    - cron: "0,30 0-6 * * 1-5"
    - cron: "20,25 6 * * 1-5"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run monitor
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
        run: python main.py --bollinger --minutes 10 --markets KR,US
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: output/summary.txt
