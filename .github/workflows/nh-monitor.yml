name: NH IPA Monitor

on:
  workflow_dispatch:
  schedule:
    # 평일 08:10 KST (일~목 23:10 UTC)
    - cron: "10 23 * * 0-4"
    # 평일 12:00 KST
    - cron: "0 3 * * 1-5"
    # 평일 16:00 KST
    - cron: "0 7 * * 1-5"

concurrency:
  group: nh-ipa-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python and watchlist
        run: |
          python -m compileall -q .
          python -m json.tool config/bollinger_watchlist.json > /dev/null

      - name: Run regular monitor and send Telegram alert
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
          NH_CANO: ${{ secrets.NH_CANO }}
          NH_ACCOUNT: ${{ secrets.NH_ACCOUNT }}
          NH_ACNT_PRDT_CD: ${{ secrets.NH_ACNT_PRDT_CD }}
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY || secrets.NH_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET || secrets.NH_APP_SECRET }}
          NHPLUG_DEFAULT_ACCOUNT: ${{ secrets.NHPLUG_DEFAULT_ACCOUNT || secrets.NH_CANO || secrets.NH_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
        run: python main.py --bollinger

      - name: Run account-based sigma report and send Telegram alert
        if: always()
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
          NH_CANO: ${{ secrets.NH_CANO }}
          NH_ACCOUNT: ${{ secrets.NH_ACCOUNT }}
          NH_ACNT_PRDT_CD: ${{ secrets.NH_ACNT_PRDT_CD }}
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY || secrets.NH_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET || secrets.NH_APP_SECRET }}
          NHPLUG_DEFAULT_ACCOUNT: ${{ secrets.NHPLUG_DEFAULT_ACCOUNT || secrets.NH_CANO || secrets.NH_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
        run: python sigma_morning_report.py

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh-monitor-summary
          path: |
            output/summary.txt
            output/sigma_morning_report.txt
          if-no-files-found: ignore
