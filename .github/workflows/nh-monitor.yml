name: NH PLUG Morning Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 0-4"
    - cron: "0 0 * * 1-5"
    - cron: "0,30 0-6 * * 1-5"
    - cron: "20,25 6 * * 1-5"

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run monitor
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
        run: python main.py --minutes 10
      - name: Upload Excel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh-market-report-${{ github.run_id }}
          path: |
            output/투자_실시간수급_매매일지.xlsx
            output/summary.txt
      - name: Create issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f output/summary.txt ]; then
            gh issue create --title "NH PLUG 브리핑 $(date +'%Y-%m-%d %H:%M KST')" --body-file output/summary.txt --label alert
          fi
