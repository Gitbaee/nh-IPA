name: NH IPA Monitor

on:
  workflow_dispatch:          # 수동 실행
  schedule:
    # 평일 아침 8:00 KST ≈ 23:00 UTC (전날)
    - cron: "0 23 * * 0-4"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Bollinger + Foreign monitor
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
          NH_ACCOUNT_NO: ${{ secrets.NH_ACCOUNT_NO }}
          NH_DOMESTIC_ACCOUNT_NO: ${{ secrets.NH_DOMESTIC_ACCOUNT_NO }}
          NH_OVERSEAS_ACCOUNT_NO: ${{ secrets.NH_OVERSEAS_ACCOUNT_NO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          # 볼린저만 먼저 (빠르고 안정적)
          python main.py --bollinger

          # 외국계 실시간은 짧게 테스트 (원하면 --seconds 늘리기)
          # GitHub Actions 무료 시간 제한 때문에 기본 3분으로 설정
          python main.py --foreign --seconds 180

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: |
            output/summary.txt
            data/
          if-no-files-found: ignore
