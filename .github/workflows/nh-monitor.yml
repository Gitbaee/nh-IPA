name: NH IPA Monitor

on:
  workflow_dispatch:
  schedule:
    # 평일 08:10 KST (일~목 23:10 UTC)
    - cron: "10 23 * * 0-4"
    # 평일 12:00 KST
    - cron: "0 3 * * 1-5"
    # 평일 16:00 KST
    - cron: "0 7 * * 1-5"

concurrency:
  group: nh-ipa-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor and send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
        run: python main.py --bollinger

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh-monitor-summary
          path: output/summary.txt
          if-no-files-found: ignore
