name: NH PLUG Morning Monitor

on:
  schedule:
    - cron: "0 23 * * 0-5"
    - cron: "0 0 * * 1-6"
    - cron: "0,30 0-6 * * 1-6"
    - cron: "20,25 6 * * 1-6"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run monitor
        env:
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
        run: python main.py --bollinger --minutes 10 --markets KR,US
      - name: Show summary
        if: always()
        run: cat output/summary.txt || echo "summary 없음"
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: output/summary.txt
      - name: Create Issue if alert exists
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f output/summary.txt ]; then
            CONTENT=$(cat output/summary.txt)
            if echo "$CONTENT" | grep -E "🔵|🔴|💥|📈|📉|⚠️" > /dev/null; then
              echo "알림 있음 - 이슈 생성"
              gh issue create --title "📢 NH Bollinger Alert $(date +'%m/%d %H:%M')" --body "$CONTENT" || true
            else
              echo "✅ 정상 스캔 - 무사!"
              echo "$CONTENT"
            fi
          fi